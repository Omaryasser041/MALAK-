<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>لملك ♥</title>
<meta property="og:title" content="لملك ♥"><meta property="og:description" content="افتحي المفاجأة">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a0a3d;--bg2:#0d0316;--rose:#ff2d6f;--blush:#ffd1dc;--gold:#ffd27a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%);color:var(--blush);font-family:Cairo,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.st{position:fixed;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;z-index:0}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2dvh;transition:opacity .8s,visibility .8s}
.open .intro{opacity:0;visibility:hidden}
.intro .h{font-size:min(34vw,18dvh);color:var(--rose);animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 0 24px var(--rose));line-height:1}
.intro h2{font:700 clamp(2.4rem,9dvh,4.5rem)/1 "Aref Ruqaa",serif;margin:0;text-shadow:0 0 18px var(--rose)}
button{font:800 1.05rem Cairo,sans-serif;color:#fff;background:linear-gradient(135deg,#ff2d6f,#b0197a);border:0;border-radius:99px;padding:.8em 1.6em;box-shadow:0 0 22px rgba(255,45,111,.55);cursor:pointer}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.alt{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,209,220,.5)}
.main{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3dvh 1rem 4dvh;pointer-events:none}
.main button{pointer-events:auto}
.stage{display:flex;flex-direction:column;align-items:center;gap:1.4dvh;text-align:center;transition:opacity .7s}
.s .stage{opacity:0}
.pic{width:min(66vw,36dvh);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(255,45,111,.8));opacity:0;transform:scale(.2)}
.pic div{width:100%;height:100%;clip-path:url(#hc)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.open .pic{animation:pop 1.3s .9s cubic-bezier(.2,1.6,.4,1) forwards,beat 1.3s 2.3s ease-in-out infinite}
h1{font:700 clamp(3rem,13dvh,6rem)/1 "Aref Ruqaa",serif;margin:0;color:#fff;text-shadow:0 0 14px var(--rose),0 0 40px var(--rose);opacity:0}
.open h1{animation:fi 1s 1.8s forwards}
.l{margin:0;font-size:clamp(1rem,2.7dvh,1.35rem);font-weight:600;max-width:21em;opacity:0}
.open .l{animation:fi 1s forwards}
.l1{animation-delay:2.6s!important}.l2{animation-delay:3.8s!important}.l3{animation-delay:5s!important;color:var(--gold);font-weight:800}
.hint{font-size:.85rem;opacity:0;margin:0}
.open .hint{animation:fi 1s 6.2s forwards}
.act{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;opacity:0}
.open .act{animation:fi 1s 6s forwards}
@keyframes fi{to{opacity:1}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.st{animation:none}.intro .h{animation:none}}
</style></head><body>

  <h1>ملك</h1>
  <p class="l l1">أحلى حاجة حصلتلي في الدنيا إنك جنبي.</p>
  <p class="l l2">كل ما أمسك إيدك الدنيا بتهدى وتحلو.</p>
  <p class="l l3">بحبك يا ملوكتي، أكتر من أي كلام.</p>
  <p class="hint">اسحبي صباعك على الشاشة وارسمي بالنجوم والقلوب</p>
 </div>
 <div class="act"><button id="sp">مفاجأة</button><button id="fw" class="alt">ألعاب نارية تاني</button></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),P=[],cols=['#ff2d6f','#ff7aa8','#ffd1dc','#ffd27a','#b28cff','#ffffff'];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],red=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,D=Math.min(devicePixelRatio||1,2),shape=false,opened=false,ptr=0;
function size(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
for(let i=0;i<70;i++){const s=document.createElement('i');s.className='st';const z=rnd(1,3);s.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,100)}%;width:${z}px;height:${z}px;animation-delay:${rnd(0,3)}s`;document.getElementById('stars').appendChild(s)}
function hp(c,s){c.moveTo(0,-s*.2);c.bezierCurveTo(0,-s*.45,-s*.5,-s*.45,-s*.5,-s*.2);c.bezierCurveTo(-s*.5,s*.1,0,s*.25,0,s*.5);c.bezierCurveTo(0,s*.25,s*.5,s*.1,s*.5,-s*.2);c.bezierCurveTo(s*.5,-s*.45,0,-s*.45,0,-s*.2)}
function add(p){p.life=0;p.rot=p.rot||rnd(-.5,.5);P.push(p)}
function burst(x,y,n){n=n||(red?30:70);const a=pick(cols),b=pick(cols);for(let i=0;i<n;i++){const t=Math.PI*2*i/n,v=rnd(1.5,6);add({x,y,vx:Math.cos(t)*v,vy:Math.sin(t)*v,g:.05,dr:.985,max:rnd(60,110),size:rnd(4,11),type:pick(['dot','heart','star','heart']),color:i%2?a:b})}}
function rain(){if(!opened||shape||P.length>900)return;add({x:rnd(0,W),y:H+20,vx:0,vy:-rnd(.7,2),g:0,dr:1,sw:rnd(0,6),max:700,size:rnd(10,26),type:'heart',color:pick(['#ff2d6f','#ff7aa8','#ffd1dc']),al:.6})}
function build(){const S=Math.min(W*.88,H*.6),o=document.createElement('canvas');o.width=o.height=S;const c=o.getContext('2d');
 c.translate(S/2,S*.47);c.beginPath();hp(c,S*1.02);c.fillStyle='#f00';c.fill();c.setTransform(1,0,0,1,0,0);
 c.fillStyle='#fff';c.font='800 '+S*.2+'px Cairo,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('MALAK',S/2,S*.45);
 const d=c.getImageData(0,0,S,S).data,st=Math.max(4,Math.round(S/58)),cx=W/2,cy=H*.46;
 for(let y=0;y<S;y+=st)for(let x=0;x<S;x+=st){const i=((y|0)*(S|0)+(x|0))*4;if(d[i+3]>128){const w=d[i+1]>128;add({x:rnd(0,W),y:H+10,vx:0,vy:0,dx:x-S/2,dy:y-S/2,cx,cy,max:1e9,size:w?2.8:2.2,type:'pt',color:w?'#fff':pick(['#ff2d6f','#ff4d88','#e0124f'])})}}}
function release(){P.forEach(p=>{if(p.dx!==undefined){delete p.dx;p.vx=rnd(-3,3);p.vy=rnd(-4,1);p.g=.05;p.dr=.98;p.max=p.life+rnd(40,90)}})}
function loop(t){X.globalCompositeOperation='destination-out';X.fillStyle='rgba(0,0,0,.26)';X.fillRect(0,0,W,H);X.globalCompositeOperation='lighter';
 const bt=1+.03*Math.max(0,Math.sin(t/180))*Math.sin(t/90);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.life++;
  if(p.dx!==undefined){p.x+=(p.cx+p.dx*bt-p.x)*.07;p.y+=(p.cy+p.dy*bt-p.y)*.07}
  else{p.vx*=p.dr;p.vy=p.vy*p.dr+p.g;p.x+=p.vx+(p.sw!==undefined?Math.sin(p.life/30+p.sw)*.6:0);p.y+=p.vy}
  let a=p.al||1;if(p.max<1e8)a*=Math.max(0,1-Math.pow(p.life/p.max,2));
  if(p.life>=p.max||p.y<-40||p.y>H+60){P.splice(i,1);continue}
  X.globalAlpha=a;X.fillStyle=p.color;
  if(p.type=='pt'){X.fillRect(p.x,p.y,p.size,p.size);continue}
  X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.beginPath();
  if(p.type=='heart')hp(X,p.size*2);else if(p.type=='star'){const s=p.size;X.moveTo(0,-s);X.quadraticCurveTo(0,0,s,0);X.quadraticCurveTo(0,0,0,s);X.quadraticCurveTo(0,0,-s,0);X.quadraticCurveTo(0,0,0,-s)}else X.arc(0,0,p.size/2,0,7);
  X.fill();X.restore()}
 X.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function brush(x,y){if(!opened||shape)return;for(let i=0;i<2;i++)add({x,y,vx:rnd(-.8,.8),vy:rnd(-1.2,.2),g:.03,dr:.97,max:rnd(40,75),size:rnd(4,10),type:pick(['star','heart','dot','star']),color:cols[ptr++%cols.length]})}
addEventListener('pointermove',e=>brush(e.clientX,e.clientY));
addEventListener('pointerdown',e=>{if(opened&&!shape&&!e.target.closest('button'))burst(e.clientX,e.clientY,28)});
document.getElementById('go').onclick=()=>{document.body.classList.add('open');opened=true;
 for(let i=0;i<7;i++)setTimeout(()=>burst(rnd(W*.15,W*.85),rnd(H*.15,H*.5)),i*280);
 setInterval(rain,170);setInterval(()=>{if(!shape)burst(rnd(W*.1,W*.9),rnd(H*.1,H*.45))},2200)};
document.getElementById('fw').onclick=()=>{if(shape)return;for(let i=0;i<5;i++)setTimeout(()=>burst(rnd(W*.1,W*.9),rnd(H*.1,H*.5)),i*200)};
const sp=document.getElementById('sp');
sp.onclick=()=>{shape=!shape;document.body.classList.toggle('s',shape);if(shape){sp.textContent='ارجعي';build()}else{sp.textContent='مفاجأة';release();burst(W/2,H/2,90)}};
</script></body></html>
